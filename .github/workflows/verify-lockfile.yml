# .github/workflows/actions.lock がワークフローと一致しているか、
# ロックしたコミットが上流で検証できるかを確認する
name: Verify Actions Lockfile
on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: install gh-actions-lock
        run: gh extension install github/gh-actions-lock --pin v0.4.0

      - name: verify
        run: gh actions-lock --verify
