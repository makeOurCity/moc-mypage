name: Jest Unit Test
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read
  # jest-coverage-report-action が PR コメントとチェックの注釈を書き込むため
  checks: write
  pull-requests: write

jobs:
  unit_test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7.0.1

      - name: setup-node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: "package.json"
          cache: npm

      - name: cache-node-modules
        uses: actions/cache@v6.1.0
        id: node_modules_cache_id
        env:
          cache-name: cache-node-modules
        with:
          path: "**/node_modules"
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}

      - name: npm-install
        if: ${{ steps.node_modules_cache_id.outputs.cache-hit != 'true' }}
        run: npm i

      - name: codegen
        run: npm run codegen

      - name: jest
        id: coverage
        uses: ArtiomTr/jest-coverage-report-action@v2.3.1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          test-script: npm run test:ci
          # push 時のコミットコメントには contents: write が必要なため、PR 以外はジョブサマリーに出す
          output: ${{ github.event_name == 'pull_request' && 'comment' || 'report-markdown' }}

      - name: coverage summary
        if: ${{ always() && github.event_name != 'pull_request' && steps.coverage.outputs.report != '' }}
        env:
          REPORT: ${{ steps.coverage.outputs.report }}
        run: echo "$REPORT" >> "$GITHUB_STEP_SUMMARY"
